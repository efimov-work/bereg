services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_LEADS_ENABLED: ${NEXT_PUBLIC_LEADS_ENABLED:-0}
        SITE_NOINDEX: ${SITE_NOINDEX:-1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_YM_ID: ${NEXT_PUBLIC_YM_ID:-}
    image: bereg:latest
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      LEADS_ENABLED: ${LEADS_ENABLED:-0}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LEADS_DATA_DIR: /app/.data
    volumes:
      - leads-data:/app/.data
    restart: unless-stopped
    mem_limit: 512m

volumes:
  leads-data:
